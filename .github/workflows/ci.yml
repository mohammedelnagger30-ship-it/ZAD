name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (verify)
    # windows-latest on purpose: the verify chain runs check:icons, which inspects
    # the generated PNGs through PowerShell + System.Drawing — that does not exist
    # on the Linux runners.
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The full chain, in the same order a release goes through locally:
      # typecheck → lint → unit tests → Quran-text/data/page/flow/icon/timezone
      # content checks → production build → PWA precache asset audit. A change
      # that breaks types, tests, or the integrity of the mushaf text fails here
      # instead of on a device.
      - name: Verify (typecheck, lint, tests, content checks, build)
        run: npm run verify

  android:
    name: Android (assembleRelease)
    # Builds the *release* variant so R8/minification and the manifest are
    # exercised on every push, not just when someone cuts a build by hand. No
    # keystore is configured in CI, so the APK comes out unsigned — the point
    # here is to fail loudly if the Gradle project or the shrink rules break,
    # not to publish an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (Capacitor requires JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web bundle into the Android project
        run: npx cap sync android

      # The wrapper is committed without the executable bit, so grant it here.
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble release APK (R8 + resource shrinking)
        run: ./android/gradlew -p android assembleRelease
