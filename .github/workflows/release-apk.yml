name: Android APK release

on:
  # Releases are cut from version tags (push a `v*` tag) or manually
  # via workflow_dispatch. A plain push to main must NOT publish a
  # release — GITHUB_RUN_NUMBER-based "1.0.N" tags were polluting
  # the releases page.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A release used to verify nothing of its own: on commit `b42b8b6` the APK was
  # published while CI was red on that very commit, because the two workflows
  # shared no gate. This runs the same command CI runs, on the same OS CI uses,
  # so publishing can no longer outrun the checks — including `check:icons`,
  # which needs Windows PowerShell's System.Drawing and therefore cannot run on
  # the ubuntu builder below, and `npm test`, which the release never ran at all.
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, lint, tests, content checks, build)
        run: npm run verify

  build-and-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="v${version#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version="1.0.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use MAJOR.MINOR.PATCH, received: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # versionCode must increase with every release so Android
          # accepts in-app updates. Derive it from the version itself
          # (MAJOR*1e6 + MINOR*1e3 + PATCH): GITHUB_RUN_NUMBER restarts
          # low and is already below the codes shipped to devices,
          # which made every CI release fail as a "downgrade".
          IFS='.' read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        env:
          KEYSTORE: ${{ secrets.ZAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ZAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZAD_KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for value in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required GitHub secret/variable: $value" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Typecheck, lint, tests and the content checks were removed from here:
      # the `verify` job above runs them all, and running a second, shorter copy
      # on this builder was how a partial gate came to look like a full one.
      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ steps.release.outputs.version }}
        run: npm run build

      # Checked again on the bundle actually being published, not the one the
      # verify job built: this is the `dist/` that ships inside the APK.
      - name: Check published bundle
        run: npm run check:assets

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zad-release.jks"

      - name: Build signed APK
        env:
          ZAD_KEYSTORE_PATH: ${{ runner.temp }}/zad-release.jks
          ZAD_KEYSTORE_PASSWORD: ${{ secrets.ZAD_KEYSTORE_PASSWORD }}
          ZAD_KEY_ALIAS: ${{ secrets.ZAD_KEY_ALIAS }}
          ZAD_KEY_PASSWORD: ${{ secrets.ZAD_KEY_PASSWORD }}
        run: |
          cd android
          bash ./gradlew assembleRelease \
            -PVERSION_CODE="${{ steps.release.outputs.version_code }}" \
            -PVERSION_NAME="${{ steps.release.outputs.version }}"

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          cp "$apk" "ZAD-${{ steps.release.outputs.tag }}.apk"
          gh release create "${{ steps.release.outputs.tag }}" \
            "ZAD-${{ steps.release.outputs.tag }}.apk" \
            --title "ZAD ${{ steps.release.outputs.version }}" \
            --generate-notes
