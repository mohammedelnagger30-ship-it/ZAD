apply plugin: 'com.android.application'

def appVersionCode = (rootProject.findProperty('VERSION_CODE') ?: '1').toString().toInteger()
def appVersionName = (rootProject.findProperty('VERSION_NAME') ?: '1.24.0').toString()

android {
    namespace = "com.hifzi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    testBuildType "release"
    defaultConfig {
        applicationId "com.hifzi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def signingProperties = new java.util.Properties()
    def signingPropertiesFile = file('keystore.properties')
    if (signingPropertiesFile.exists()) {
        def signingPropertiesText = signingPropertiesFile.getText('UTF-8')
        if (signingPropertiesText.startsWith('\uFEFF')) {
            signingPropertiesText = signingPropertiesText.substring(1)
        }
        signingProperties.load(new java.io.StringReader(signingPropertiesText))
    }
    // Use app-release.jks consistently for all releases to ensure updates work
    def releaseKeystorePath = System.getenv('ZAD_KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile') ?: 'app-release.jks'
    def releaseStorePassword = System.getenv('ZAD_KEYSTORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
    def releaseKeyAlias = System.getenv('ZAD_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
    def releaseKeyPassword = System.getenv('ZAD_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')
    // keystore.properties and *.jks are gitignored, so a fresh CI checkout has
    // neither. Signing is therefore conditional: with the keystore present the
    // build is signed exactly as before; without it the release build still
    // compiles, runs R8 and packages — just unsigned. That is what lets the CI
    // android job validate the Gradle project and the shrink rules on every
    // push. An unsigned APK is a check artifact, not an installable update.
    def releaseKeystoreFile = file(releaseKeystorePath)
    def hasReleaseKeystore = releaseKeystoreFile.exists()
    if (!hasReleaseKeystore) {
        logger.warn("Release keystore '${releaseKeystorePath}' not found; the release build will be unsigned.")
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Signed only when a keystore is actually present (see the note above
            // on signingConfigs); otherwise the build stays unsigned but still
            // minifies, so CI can exercise R8 without the release secret.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            // R8: shrink + obfuscate the Java side, and drop unused resources.
            // The web bundle (the bulk of the APK) is untouched; this trims the
            // Capacitor/plugin/library code. Keep rules live in proguard-rules.pro
            // plus capacitor-android's bundled consumer rules, which already keep
            // every `class extends com.getcapacitor.Plugin` (covers AppUpdater and
            // AdhanOverlay) and every manifest-declared component.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
