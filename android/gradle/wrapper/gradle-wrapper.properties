distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# GitHub's release CDN currently answers 504 for the Gradle archives it hosts, which is
# where services.gradle.org redirects. Tencent Cloud mirrors the identical archive;
# distributionSha256Sum is Gradle's published checksum for 8.14.3, so the mirror cannot
# substitute different bytes without the wrapper rejecting it.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip
distributionSha256Sum=ed1a8d686605fd7c23bdf62c7fc7add1c5b23b2bbc3721e661934ef4a4911d7c
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
